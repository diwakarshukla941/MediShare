services:
  # ── Production (main branch) ────────────────────────────────────────────
  - type: web
    name: medishare-api
    runtime: node
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Use the same value on both APIs because they share the MongoDB storage config.
      - key: STORAGE_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_BUCKET_NAME
        sync: false
      - key: CLOUDFLARE_PUBLIC_DOMAIN
        sync: false
      - key: CLOUDFLARE_FOLDER_PREFIX
        value: bonconnect
      - key: CLIENT_URL
        sync: false

  - type: web
    name: medishare-client
    runtime: static
    branch: main
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Staging (staging branch — PR'd in from develop) ─────────────────────
  - type: web
    name: medishare-api-staging
    runtime: node
    plan: free
    branch: staging
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Must match the production API's value while both environments share MongoDB.
      - key: STORAGE_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_BUCKET_NAME
        sync: false
      - key: CLOUDFLARE_PUBLIC_DOMAIN
        sync: false
      - key: CLOUDFLARE_FOLDER_PREFIX
        value: bonconnect
      - key: CLIENT_URL
        sync: false

  - type: web
    name: medishare-client-staging
    runtime: static
    branch: staging
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_ENV
        value: staging
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
